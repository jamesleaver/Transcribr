name: Website

# Publishes site/ to GitHub Pages from the public repository. The site
# is static - its download buttons ask GitHub for the latest release
# when the page loads - so it only needs redeploying when site/ changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages is served from the public repository only.
    if: github.repository == 'jamesleaver/Transcribr'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
