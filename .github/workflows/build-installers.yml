name: Build installers

# Windows installers are built here because building one needs Windows.
# Run it by hand from the Actions tab, or let it fire when a version tag
# is pushed - in which case the .exe is attached to that release.
#
# The macOS .pkg is NOT built here: notarising it needs the Developer ID
# certificates, and those stay on James's Mac rather than in repository
# secrets. See RELEASING.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed only to attach assets to a release

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path transcribr.py -Pattern '^__version__ = "(.*)"' |
                Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Transcribr $v"

      # webdist/ is committed, but rebuilding here means a forgotten
      # `npm run build` can never ship a stale interface.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Stage the application
        shell: pwsh
        run: pwsh -File windows\build-exe.ps1

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not present on the runner; installing it."
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is still missing at $iscc" }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} windows\transcribr.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Report what was built
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0} - {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Transcribr-${{ steps.version.outputs.version }}-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
